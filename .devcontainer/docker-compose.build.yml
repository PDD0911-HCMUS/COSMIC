# Run this on csMachine. No source/data/weights are copied into the image.
name: ${COSMIC_PROJECT_NAME:-cosmic}

services:
  cosmic:
    image: ${COSMIC_IMAGE:-cosmic:torch2.7.1-cu118}
    build:
      context: ..
      dockerfile: Dockerfile.gpu
      args:
        TORCH_VERSION: ${COSMIC_TORCH_VERSION:-2.7.1}
        TORCHVISION_VERSION: ${COSMIC_TORCHVISION_VERSION:-0.22.1}
        TORCH_CUDA: ${COSMIC_TORCH_CUDA:-cu118}
